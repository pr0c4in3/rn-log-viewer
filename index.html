<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RN Log Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: #131a23;
        --panel-strong: #18222e;
        --line: #273342;
        --text: #e7edf5;
        --muted: #8694a6;
        --blue: #62a8ff;
        --green: #46d483;
        --yellow: #e7b44d;
        --red: #ff6b69;
        --shadow: 0 16px 42px rgba(0, 0, 0, .22);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input, select { font: inherit; }
      button, select, input {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
      }
      button { cursor: pointer; }
      button:hover:not(:disabled), button.active {
        border-color: var(--blue);
        color: var(--blue);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: .35;
      }
      input, select { outline: none; }
      input:focus, select:focus { border-color: var(--blue); }

      .app-shell { display: flex; height: 100%; }
      .sidebar {
        display: flex;
        flex: 0 0 220px;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: #0e141c;
        transition: none;
      }
      .sidebar.collapsed { flex-basis: 66px; }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 62px;
        padding: 0 17px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        white-space: nowrap;
      }
      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        place-items: center;
        border-radius: 9px;
        background: var(--blue);
        color: #08111d;
        font-weight: 800;
      }
      .sidebar.collapsed .brand { justify-content: center; gap: 0; padding: 0; }
      .sidebar.collapsed .brand-mark { display: none; }
      .sidebar.collapsed .brand-text,
      .sidebar.collapsed .nav-label { display: none; }
      .sidebar-toggle {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        place-items: center;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .nav { display: grid; gap: 5px; padding: 8px; }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        text-align: left;
      }
      .nav-item.active {
        border-color: rgba(98, 168, 255, .25);
        background: rgba(98, 168, 255, .12);
        color: var(--blue);
      }
      .nav-icon { width: 18px; flex: 0 0 18px; text-align: center; }
      .sidebar.collapsed .nav-item { justify-content: center; padding: 0; }
      .sidebar-footer {
        margin-top: auto;
        padding: 14px 16px;
        color: var(--muted);
        font-size: 11px;
      }
      .sidebar.collapsed .sidebar-footer { display: none; }

      .workspace { min-width: 0; flex: 1; }
      .view { display: none; height: 100%; min-width: 0; }
      .view.active { display: flex; flex-direction: column; }
      .view-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 62px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
      }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 18px; }
      h2 { font-size: 14px; }
      .muted { color: var(--muted); }
      .connection {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .connection::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--yellow);
        content: "";
      }
      .connection.online::before { background: var(--green); }
      .connection-progress {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 150px;
        color: var(--muted);
        font-size: 11px;
      }
      .connection-progress[hidden] { display: none; }
      .view-header-actions { display: flex; align-items: center; gap: 12px; }
      .settings-button { padding: 6px 10px; color: var(--blue); }
      .progress-track {
        width: 84px;
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--line);
      }
      .progress-bar {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: var(--blue);
        transition: width .12s ease;
      }

      .dashboard-grid {
        display: grid;
        min-height: 0;
        flex: 1;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 12px;
      }
      .card {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 45px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
      }
      .card-body { min-height: 0; flex: 1; padding: 12px; }
      .console-output {
        height: 100%;
        overflow: auto;
        overflow-x: hidden;
        min-width: 0;
        color: #c8d3df;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .console-line {
        display: flex;
        gap: 8px;
        min-width: 0;
        max-width: 100%;
        padding: 3px 0;
        border-bottom: 1px solid rgba(39, 51, 66, .45);
      }
      .console-time { flex: 0 0 66px; color: var(--muted); }
      .console-level { flex: 0 0 42px; font-weight: 700; }
      .console-level.warn { color: var(--yellow); }
      .console-level.error { color: var(--red); }
      .console-level.log { color: var(--green); }
      .console-source { flex: 0 0 72px; color: var(--blue); }
      .console-message {
        min-width: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .table-toolbar { display: flex; gap: 8px; align-items: center; }
      select { padding: 6px 8px; }
      .table-wrap { height: 100%; overflow: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td {
        max-width: 260px;
        padding: 7px 8px;
        border-bottom: 1px solid rgba(39, 51, 66, .7);
        text-align: left;
        vertical-align: top;
      }
      th { position: sticky; top: 0; background: var(--panel-strong); color: var(--muted); font-weight: 600; }
      td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .control-body { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 9px; }
      .control-button { padding: 9px 13px; }
      .control-button.start { border-color: rgba(70, 212, 131, .45); color: var(--green); }
      .control-button.stop { border-color: rgba(255, 107, 105, .45); color: var(--red); }
      .control-hint { width: 100%; color: var(--muted); font-size: 12px; }
      .status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .status-item { padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-strong); }
      .status-label { color: var(--muted); font-size: 11px; }
      .status-value { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status-value.running { color: var(--green); }
      .status-value.stopped { color: var(--yellow); }

      .log-view { min-height: 0; }
      .log-list { min-height: 0; flex: 1; overflow: auto; overflow-x: hidden; padding: 12px; }
      .entry-list { display: block; min-height: 100%; }
      .virtual-spacer { width: 1px; opacity: 0; pointer-events: none; }
      .entry {
        min-width: 0;
        max-width: 100%;
        margin-bottom: 7px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--green);
        border-radius: 7px;
        background: var(--panel);
        cursor: pointer;
        transition: border-color .15s ease, background .15s ease;
      }
      .entry:hover { border-color: var(--blue); background: var(--panel-strong); }
      .entry.warn { border-left-color: var(--yellow); }
      .entry.error { border-left-color: var(--red); }
      .entry.compact-entry {
        position: relative;
        margin-bottom: 1px;
        border: 0;
        border-left: 2px solid var(--bg);
        border-radius: 0;
        background: var(--panel);
      }
      .entry.compact-entry:hover {
        border-color: var(--bg);
        background: var(--panel-strong);
      }
      .entry.compact-entry.log { border-left-color: var(--green); }
      .entry.compact-entry.warn { border-left-color: var(--yellow); }
      .entry.compact-entry.error { border-left-color: var(--red); }
      .entry.compact-entry .entry-head {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 1;
        justify-content: flex-end;
        padding: 6px 9px 0;
        pointer-events: none;
      }
      .entry.compact-entry .entry-time { margin-left: 0; }
      .entry.compact-entry .entry-message {
        min-height: 18px;
        padding: 7px 90px 7px 9px;
      }
      .entry-head { display: flex; align-items: center; gap: 9px; padding: 7px 9px 2px; color: var(--muted); font-size: 11px; }
      .entry-level { min-width: 39px; font-weight: 700; text-transform: uppercase; }
      .entry-level.log { color: var(--green); }
      .entry-level.warn { color: var(--yellow); }
      .entry-level.error { color: var(--red); }
      .entry-source { color: var(--blue); }
      .entry-time { margin-left: auto; }
      .entry-message {
        display: block;
        margin: 0;
        padding: 2px 9px 9px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      mark { padding: 0 2px; border-radius: 2px; background: rgba(231, 180, 77, .38); color: #fff4cc; }
      .empty { padding: 70px 20px; color: var(--muted); text-align: center; }
      .log-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        padding: 9px 12px;
        border-top: 1px solid var(--line);
        background: #0f151d;
      }
      .log-search { min-width: 180px; flex: 1; padding: 7px 9px; }
      .filter-button, .toolbar-button { padding: 6px 9px; font-size: 12px; }
      .filter-button.active { border-color: var(--blue); background: rgba(98, 168, 255, .12); color: var(--blue); }
      .toolbar-spacer { flex: 1; }

      .drawer-backdrop[hidden], .drawer[hidden] { display: none; }
      .drawer-backdrop { position: fixed; inset: 0; z-index: 5; background: rgba(0, 0, 0, .45); }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 6;
        display: flex;
        width: 85vw;
        height: 100%;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: var(--panel);
        box-shadow: -18px 0 48px rgba(0, 0, 0, .35);
      }
      .drawer-header { display: flex; align-items: center; gap: 14px; min-width: 0; padding: 15px 17px; border-bottom: 1px solid var(--line); }
      .drawer-heading { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
      .drawer-heading h2 { flex: 0 0 auto; }
      .drawer-summary { display: flex; min-width: 0; flex: 1; gap: 12px; overflow: hidden; color: var(--muted); font-size: 12px; }
      .drawer-summary-item { display: flex; min-width: 0; gap: 4px; white-space: nowrap; }
      .drawer-summary-label { flex: 0 0 auto; color: var(--muted); }
      .drawer-summary-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .drawer-actions { display: flex; align-items: center; gap: 8px; }
      .format-button { padding: 6px 10px; color: var(--yellow); }
      .copy-button { padding: 6px 10px; color: var(--blue); }
      .log-link { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .drawer-close { width: 30px; height: 30px; color: var(--muted); }
      .drawer-content { min-height: 0; flex: 1; overflow: auto; padding: 17px; }
      .drawer-content pre { max-width: 100%; margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; word-break: break-word; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .settings-modal[hidden] { display: none; }
      .settings-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 7;
        width: min(420px, calc(100vw - 32px));
        transform: translate(-50%, -50%);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .settings-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; border-bottom: 1px solid var(--line); }
      .settings-close { width: 30px; height: 30px; color: var(--muted); }
      .settings-body { padding: 17px; }
      .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-strong); }
      .settings-label { display: grid; gap: 3px; }
      .settings-label strong { font-size: 13px; }
      .settings-label span { color: var(--muted); font-size: 12px; }
      .settings-checkbox { width: 18px; height: 18px; accent-color: var(--blue); }
      .history-prompt[hidden] { display: none; }
      .history-prompt {
        position: fixed;
        top: 74px;
        right: 20px;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 16px;
        max-width: min(430px, calc(100vw - 32px));
        padding: 12px 14px;
        border: 1px solid var(--blue);
        border-radius: 10px;
        background: var(--panel-strong);
        box-shadow: var(--shadow);
      }
      .history-prompt-content { display: grid; gap: 3px; }
      .history-prompt-content span { color: var(--muted); font-size: 12px; }
      .history-prompt-actions { display: flex; flex: 0 0 auto; gap: 7px; }
      .history-prompt-actions button { padding: 6px 9px; font-size: 12px; }
      .history-prompt-load { border-color: var(--blue); color: var(--blue); }
      .history-prompt-skip { color: var(--muted); }

      @media (max-width: 820px) {
        .sidebar { flex-basis: 66px; }
        .sidebar .brand { padding: 0 18px; }
        .brand-text, .nav-label, .sidebar-footer { display: none; }
        .nav-item { justify-content: center; padding: 0; }
        .dashboard-grid { grid-template-rows: repeat(4, minmax(170px, 1fr)); }
        .dashboard-grid .card { grid-column: 1 / -1; }
        .dashboard-grid { overflow: auto; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <button id="sidebarToggle" class="sidebar-toggle" type="button" title="展开/折叠侧边栏">☰</button>
          <span class="brand-mark">RN</span>
          <span class="brand-text">Log Viewer</span>
        </div>
        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" type="button" data-view="dashboard">
            <span class="nav-icon">▦</span>
            <span class="nav-label">Dashboard</span>
          </button>
          <button class="nav-item" type="button" data-view="log">
            <span class="nav-icon">≡</span>
            <span class="nav-label">Log</span>
          </button>
        </nav>
        <div class="sidebar-footer">只在本机收集，不上传日志</div>
      </aside>

      <main class="workspace">
        <section id="dashboardView" class="view active">
          <header class="view-header">
            <div>
              <h1>Dashboard</h1>
              <span class="muted">RN 开发运行面板</span>
            </div>
            <div class="view-header-actions">
              <button id="settingsButton" class="settings-button" type="button">设置</button>
              <span id="connection" class="connection">连接中</span>
              <span id="connectionProgress" class="connection-progress" hidden>
                <span class="progress-track"><span id="progressBar" class="progress-bar"></span></span>
                <span id="progressText">0/0</span>
              </span>
            </div>
          </header>
          <div class="dashboard-grid">
            <article class="card">
              <div class="card-header"><h2>实时控制台</h2><span id="consoleCount" class="muted">0 条</span></div>
              <div class="card-body"><div id="consoleOutput" class="console-output"></div></div>
            </article>
            <article class="card">
              <div class="card-header">
                <h2>数据表格</h2>
                <select id="tableMode" aria-label="选择数据表格">
                  <option value="recent">最新日志</option>
                  <option value="levels">级别统计</option>
                  <option value="sources">来源统计</option>
                </select>
              </div>
              <div class="card-body table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
            </article>
            <article class="card">
              <div class="card-header"><h2>RN 控制</h2><span id="controlState" class="muted">未运行</span></div>
              <div class="card-body control-body">
                <button id="startRn" class="control-button start" type="button">启动 RN</button>
                <button id="stopRn" class="control-button stop" type="button">停止 RN</button>
                <p class="control-hint">工作目录：<span id="devCwd">读取中……</span></p>
              </div>
            </article>
            <article class="card">
              <div class="card-header"><h2>运行状态</h2><span class="muted">本地服务</span></div>
              <div class="card-body status-grid">
                <div class="status-item"><div class="status-label">RN</div><div id="statusRn" class="status-value stopped">未运行</div></div>
                <div class="status-item"><div class="status-label">已收集日志</div><div id="statusEntries" class="status-value">0</div></div>
                <div class="status-item"><div class="status-label">网页连接</div><div id="statusClients" class="status-value">0</div></div>
                <div class="status-item"><div class="status-label">页面热更新</div><div class="status-value running">已开启</div></div>
              </div>
            </article>
          </div>
        </section>

        <section id="logView" class="view log-view">
          <div class="log-list">
            <div id="entryList" class="entry-list"></div>
            <div id="empty" class="empty">等待 RN 日志……</div>
          </div>
          <div class="log-toolbar">
            <input id="search" class="log-search" type="search" placeholder="搜索并高亮日志内容……" />
            <button class="filter-button active" type="button" data-level-filter="all">全部 <span>0</span></button>
            <button class="filter-button" type="button" data-level-filter="log">Log <span>0</span></button>
            <button class="filter-button" type="button" data-level-filter="warn">Warn <span>0</span></button>
            <button class="filter-button" type="button" data-level-filter="error">Error <span>0</span></button>
            <span class="toolbar-spacer"></span>
            <button id="pause" class="toolbar-button" type="button">暂停记录</button>
            <button id="clear" class="toolbar-button" type="button">清空</button>
            <button id="export" class="toolbar-button" type="button">导出 JSON</button>
          </div>
        </section>
      </main>
    </div>

    <div id="historyPrompt" class="history-prompt" hidden role="dialog" aria-label="加载历史消息">
      <div class="history-prompt-content">
        <strong id="historyPromptTitle">加载历史消息？</strong>
        <span id="historyPromptMessage">服务中已有的日志将加入当前列表</span>
      </div>
      <div class="history-prompt-actions">
        <button id="loadHistory" class="history-prompt-load" type="button">加载</button>
        <button id="skipHistory" class="history-prompt-skip" type="button">跳过</button>
      </div>
    </div>

    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="drawer" class="drawer" hidden aria-label="日志详情">
      <div class="drawer-header">
        <div class="drawer-heading">
          <h2>日志详情</h2>
          <div class="drawer-summary">
            <span class="drawer-summary-item"><span class="drawer-summary-label">级别</span><strong id="drawerLevel" class="drawer-summary-value"></strong></span>
            <span class="drawer-summary-item"><span class="drawer-summary-label">来源</span><span id="drawerSource" class="drawer-summary-value"></span></span>
            <span class="drawer-summary-item"><span class="drawer-summary-label">时间</span><span id="drawerTime" class="drawer-summary-value"></span></span>
            <span class="drawer-summary-item"><span class="drawer-summary-label">ID</span><span id="drawerId" class="drawer-summary-value"></span></span>
          </div>
        </div>
        <div class="drawer-actions">
          <button id="formatLog" class="format-button" type="button">格式化</button>
          <button id="copyLog" class="copy-button" type="button">复制日志</button>
          <button id="drawerClose" class="drawer-close" type="button">×</button>
        </div>
      </div>
      <div class="drawer-content"><pre id="drawerMessage"></pre></div>
    </aside>
    <div id="settingsBackdrop" class="drawer-backdrop" hidden></div>
    <section id="settingsModal" class="settings-modal" hidden aria-label="设置">
      <div class="settings-header">
        <h2>设置</h2>
        <button id="settingsClose" class="settings-close" type="button">×</button>
      </div>
      <div class="settings-body">
        <label class="settings-row" for="compactModeSetting">
          <span class="settings-label">
            <strong>精简模式</strong>
            <span>隐藏级别和 rn-stdout，使用高密度分割线列表</span>
          </span>
          <input id="compactModeSetting" class="settings-checkbox" type="checkbox" checked />
        </label>
        <label class="settings-row" for="mergeStartupSetting">
          <span class="settings-label">
            <strong>合并启动内容</strong>
            <span>将首个 Log、Warn 或 Error 之前的内容合并为一条 Log</span>
          </span>
          <input id="mergeStartupSetting" class="settings-checkbox" type="checkbox" checked />
        </label>
        <label class="settings-row" for="virtualScrollingSetting">
          <span class="settings-label">
            <strong>虚拟滚动</strong>
            <span>只渲染可视区域附近的日志，关闭后展示完整列表</span>
          </span>
          <input id="virtualScrollingSetting" class="settings-checkbox" type="checkbox" checked />
        </label>
        <label class="settings-row" for="loadHistorySetting">
          <span class="settings-label">
            <strong>加载历史消息</strong>
            <span>连接后询问是否加载服务端已保存的历史日志</span>
          </span>
          <input id="loadHistorySetting" class="settings-checkbox" type="checkbox" checked />
        </label>
      </div>
    </section>

    <script>
      const state = {
        entries: [],
        entryIds: new Set(),
        entrySignatures: new Set(),
        selectedLevels: new Set(),
        tableMode: 'recent',
        autoScroll: true,
        refreshPaused: false,
        activeView: 'dashboard',
        devRunning: false,
        controlBusy: false,
        drawerEntry: null,
        drawerFormatted: false,
        replaying: false,
        replayTotal: 0,
        replayCurrent: 0,
        renderScheduled: false,
        compactMode: true,
        virtualEntries: [],
        virtualHeights: new Map(),
        virtualMetricsCache: new Map(),
        virtualTotalHeight: 0,
        virtualRenderScheduled: false,
        renderVersion: 0,
        deferredEntryIds: new Set(),
        pendingUpdates: new Map(),
        visibleEntriesCache: new Map(),
        searchTextCache: new WeakMap(),
        renderScrollToBottom: undefined,
        mergeStartup: true,
        displayEntriesCache: new Map(),
        virtualScrolling: true,
        programmaticScroll: false,
        entryQueue: [],
        loadHistory: readStoredBoolean('loadHistory', true),
        historyPromptShown: false,
        historyPromptMode: null,
        historyLoaded: false,
        historyLoading: false,
        connected: false,
        pauseQueueStart: null,
        resumeBufferEnd: null,
        resumePendingUpdateIds: new Set(),
        awaitingResumeChoice: false,
      }

      const $ = selector => document.querySelector(selector)
      const entryList = $('#entryList')
      const emptyNode = $('#empty')
      const searchNode = $('#search')
      const levelFilters = [...document.querySelectorAll('[data-level-filter]')]
      const logList = entryList.parentElement
      const bottomFollowDistance = 50

      function readStoredBoolean(key, fallback) {
        try {
          const value = localStorage.getItem(`rn-log-viewer.${key}`)
          return value === null ? fallback : value === 'true'
        } catch {
          return fallback
        }
      }

      function writeStoredBoolean(key, value) {
        try {
          localStorage.setItem(`rn-log-viewer.${key}`, String(value))
        } catch {}
      }

      function getBottomDistance() {
        return Math.max(
          0,
          logList.scrollHeight - logList.scrollTop - logList.clientHeight
        )
      }

      function isLogNearBottom() {
        return getBottomDistance() <= bottomFollowDistance
      }

      function scrollLogToBottom() {
        const top = Math.max(0, logList.scrollHeight - logList.clientHeight)
        if (Math.abs(logList.scrollTop - top) <= 1) return
        setLogScrollTop(top)
      }

      function setLogScrollTop(top) {
        state.programmaticScroll = true
        logList.scrollTop = Math.max(0, top)
        requestAnimationFrame(() => {
          state.programmaticScroll = false
        })
      }

      function formatTime(value) {
        return new Date(value).toLocaleTimeString()
      }

      function formatDate(value) {
        return new Date(value).toLocaleString()
      }

      function escapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      }

      function normalizeAnsi(value) {
        return value.replace(/\\u001b|\\x1b/g, '\u001b')
      }

      const ansiColors = {
        30: '#1f2328', 31: '#ff6b69', 32: '#46d483', 33: '#e7b44d',
        34: '#62a8ff', 35: '#d58cff', 36: '#5dd9d1', 37: '#e7edf5',
        90: '#7d8590', 91: '#ff8b87', 92: '#6ee7a1', 93: '#f4d06f',
        94: '#8bc3ff', 95: '#e5b3ff', 96: '#94ebe4', 97: '#ffffff',
      }

      function ansi256Color(value) {
        if (value < 16) return ansiColors[value < 8 ? value + 30 : value + 82]
        if (value >= 232) {
          const shade = 8 + (value - 232) * 10
          return `rgb(${shade}, ${shade}, ${shade})`
        }
        const index = value - 16
        const red = Math.floor(index / 36)
        const green = Math.floor((index % 36) / 6)
        const blue = index % 6
        const channel = item => item === 0 ? 0 : 55 + item * 40
        return `rgb(${channel(red)}, ${channel(green)}, ${channel(blue)})`
      }

      function applyAnsiCodes(style, codes) {
        for (let index = 0; index < codes.length; index += 1) {
          const code = codes[index]
          if (code === 0) {
            Object.keys(style).forEach(key => delete style[key])
          } else if (code === 1) style.fontWeight = '700'
          else if (code === 2) style.opacity = '.75'
          else if (code === 3) style.fontStyle = 'italic'
          else if (code === 4) style.textDecoration = 'underline'
          else if (code === 22) {
            delete style.fontWeight
            delete style.opacity
          } else if (code === 23) delete style.fontStyle
          else if (code === 24) delete style.textDecoration
          else if (code === 39) delete style.color
          else if (code === 49) delete style.backgroundColor
          else if (ansiColors[code]) style.color = ansiColors[code]
          else if (ansiColors[code - 10]) style.backgroundColor = ansiColors[code - 10]
          else if (code === 38 || code === 48) {
            const property = code === 38 ? 'color' : 'backgroundColor'
            const mode = codes[index + 1]
            if (mode === 5 && codes[index + 2] !== undefined) {
              style[property] = ansi256Color(codes[index + 2])
              index += 2
            } else if (mode === 2 && codes.length > index + 4) {
              style[property] = `rgb(${codes[index + 2]}, ${codes[index + 3]}, ${codes[index + 4]})`
              index += 4
            }
          }
        }
      }

      function appendTextWithHighlight(node, value, keyword) {
        if (!keyword) {
          node.append(document.createTextNode(value))
          return
        }
        const regex = new RegExp(`(${escapeRegExp(keyword)})`, 'ig')
        let cursor = 0
        for (const match of value.matchAll(regex)) {
          const start = match.index
          node.append(document.createTextNode(value.slice(cursor, start)))
          const mark = document.createElement('mark')
          mark.textContent = match[0]
          node.append(mark)
          cursor = start + match[0].length
        }
        node.append(document.createTextNode(value.slice(cursor)))
      }

      function trimLinkPunctuation(value) {
        return value.replace(/[.,;!?，。；！？、)\]}]+$/g, '')
      }

      async function copyText(value) {
        try {
          await navigator.clipboard.writeText(value)
          return
        } catch {
          const textarea = document.createElement('textarea')
          textarea.value = value
          document.body.append(textarea)
          textarea.select()
          document.execCommand('copy')
          textarea.remove()
        }
      }

      function appendLinkifiedText(node, value, style, keyword, options = {}) {
        const linkPattern = /https?:\/\/[^\s"'<>]+|\/(?:[^/\s"'<>]+\/)+[^/\s"'<>]+|(?:\.\.?\/)+[^\s"'<>]+/g
        let cursor = 0
        for (const match of value.matchAll(linkPattern)) {
          const start = match.index
          const candidate = trimLinkPunctuation(match[0])
          const linkEnd = start + candidate.length
          appendTextWithHighlight(
            node,
            value.slice(cursor, start),
            keyword
          )
          const link = document.createElement('a')
          const lineMatch = candidate.startsWith('http')
            ? null
            : candidate.match(/^(.*?):(\d+)(?::\d+)?$/)
          const linkTarget = lineMatch ? lineMatch[1] : candidate
          const lineNumber = lineMatch && lineMatch[2]
          const isWebLink = linkTarget.startsWith('http')
          const isRelativePath = /^(?:\.\.?\/)+/.test(linkTarget)
          const resolvedPath = isRelativePath && options.baseDirectory
            ? new URL(
              linkTarget,
              `file://${options.baseDirectory.replace(/\/$/, '')}/`
            ).pathname
            : linkTarget
          link.href = isWebLink
            ? linkTarget
            : `/api/open-file?path=${encodeURIComponent(resolvedPath)}${
              lineNumber ? `&line=${lineNumber}` : ''
            }`
          if (!isWebLink) {
            link.addEventListener('click', event => {
              event.preventDefault()
              if (event.metaKey && event.button === 0) {
                fetch(link.href).catch(() => {})
                return
              }
              copyText(lineNumber ? `${resolvedPath}:${lineNumber}` : resolvedPath)
            })
          }
          if (lineNumber) {
            link.title = isWebLink
              ? ''
              : '点击复制路径，⌘+点击在 VS Code 中打开第 '
                + `${lineNumber} 行`
          } else if (!isWebLink) {
            link.title = '点击复制路径，⌘+点击在 VS Code 中打开文件'
          }
          if (isWebLink) {
            link.target = '_blank'
            link.rel = 'noreferrer'
          }
          link.className = 'log-link'
          Object.assign(link.style, style)
          appendTextWithHighlight(link, candidate, keyword)
          node.append(link)
          cursor = linkEnd
        }
        appendTextWithHighlight(node, value.slice(cursor), keyword)
      }

      function renderAnsiText(node, value, keyword = '', options = {}) {
        const text = normalizeAnsi(String(value))
        const ansiPattern = /\u001b\[([0-9;]*)m/g
        const style = {}
        let cursor = 0
        for (const match of text.matchAll(ansiPattern)) {
          appendStyledText(node, text.slice(cursor, match.index), style, keyword, options)
          const codes = match[1] ? match[1].split(';').map(Number) : [0]
          applyAnsiCodes(style, codes)
          cursor = match.index + match[0].length
        }
        appendStyledText(node, text.slice(cursor), style, keyword, options)
      }

      function appendStyledText(node, value, style, keyword, options = {}) {
        if (!value) return
        const span = document.createElement('span')
        Object.assign(span.style, style)
        if (options.linkify) {
          appendLinkifiedText(span, value, style, keyword, options)
        }
        else appendTextWithHighlight(span, value, keyword)
        node.append(span)
      }

      function setHighlightedText(node, value, keyword) {
        node.replaceChildren()
        renderAnsiText(node, value, keyword)
      }

      function stripAnsi(value) {
        return normalizeAnsi(String(value)).replace(/\u001b\[[0-9;]*m/g, '')
      }

      function truncateAnsiText(value, limit) {
        const text = normalizeAnsi(String(value))
        const visibleText = stripAnsi(text)
        const visibleChars = Array.from(visibleText)
        if (visibleChars.length <= limit) return text

        const ansiPattern = /\u001b\[[0-9;]*m/g
        let result = ''
        let visibleCount = 0
        let cursor = 0
        while (cursor < text.length && visibleCount < limit) {
          ansiPattern.lastIndex = cursor
          const ansiMatch = ansiPattern.exec(text)
          if (ansiMatch && ansiMatch.index === cursor) {
            result += ansiMatch[0]
            cursor += ansiMatch[0].length
            continue
          }
          const codePoint = Array.from(text.slice(cursor))[0]
          result += codePoint
          cursor += codePoint.length
          visibleCount += 1
        }
        return `${result}\u001b[0m…`
      }

      function getKeyword() {
        return searchNode.value.trim()
      }

      function getEntrySearchText(entry) {
        if (state.searchTextCache.has(entry)) {
          return state.searchTextCache.get(entry)
        }
        return cacheEntrySearchText(entry)
      }

      function cacheEntrySearchText(entry) {
        const text = `${entry.source} ${entry.message}`.toLowerCase()
        state.searchTextCache.set(entry, text)
        return text
      }

      function getDisplayEntries(includeDeferred = true) {
        const cacheKey = includeDeferred ? 'all' : 'render'
        const cached = state.displayEntriesCache.get(cacheKey)
        if (cached) return cached
        const sourceEntries = includeDeferred
          ? state.entries
          : state.entries.filter(entry => !state.deferredEntryIds.has(entry.id))
        if (!state.mergeStartup) {
          state.displayEntriesCache.set(cacheKey, sourceEntries)
          return sourceEntries
        }

        const displayEntries = []
        let startupGroup
        for (const entry of sourceEntries) {
          if (!entry.startup) {
            displayEntries.push(entry)
            continue
          }
          if (!startupGroup) {
            startupGroup = {
              ...entry,
              id: `startup-${entry.id}`,
              level: 'log',
            }
            displayEntries.push(startupGroup)
          } else {
            startupGroup.message += `\n${entry.message}`
          }
        }
        state.displayEntriesCache.set(cacheKey, displayEntries)
        return displayEntries
      }

      function getVisibleEntries(includeDeferred = true) {
        const keyword = getKeyword().toLowerCase()
        const levels = [...state.selectedLevels].sort().join(',')
        const cacheKey = `${includeDeferred ? 'all' : 'render'}|${levels}|${keyword}`
        const cacheable = !keyword
        if (cacheable) {
          const cached = state.visibleEntriesCache.get(cacheKey)
          if (cached) return cached
        }
        const visible = getDisplayEntries(includeDeferred).filter(entry => {
          const levelMatched = state.selectedLevels.size === 0 || state.selectedLevels.has(entry.level)
          return levelMatched && (!keyword || getEntrySearchText(entry).includes(keyword))
        })
        if (cacheable) state.visibleEntriesCache.set(cacheKey, visible)
        return visible
      }

      function getRenderableEntries() {
        return getVisibleEntries(state.deferredEntryIds.size === 0)
      }

      function createLogEntry(entry) {
        const article = document.createElement('article')
        article.className = `entry ${entry.level}${state.compactMode ? ' compact-entry' : ''}`
        article.addEventListener('click', () => openDrawer(entry))

        const head = document.createElement('div')
        head.className = 'entry-head'
        const level = document.createElement('span')
        level.className = `entry-level ${entry.level}`
        level.textContent = entry.level
        level.hidden = state.compactMode
        const source = document.createElement('span')
        source.className = 'entry-source'
        source.hidden = state.compactMode && entry.source === 'rn-stdout'
        setHighlightedText(source, entry.source, getKeyword())
        const time = document.createElement('time')
        time.className = 'entry-time'
        time.textContent = formatTime(entry.time)
        head.append(level, source, time)

        const message = document.createElement('div')
        message.className = 'entry-message'
        const keyword = getKeyword()
        const preview = truncateAnsiText(entry.message, 250)
        renderAnsiText(message, preview, keyword)
        article.append(head, message)
        return article
      }

      function getVirtualKey(entry) {
        return [entry.id, state.compactMode, entry.message.length].join('|')
      }

      function estimateEntryHeight(entry) {
        const preview = truncateAnsiText(entry.message, 250)
        const lineCount = Math.max(1, Math.ceil(stripAnsi(preview).length / 120))
        const gap = state.compactMode ? 1 : 7
        return 38 + lineCount * 18 + gap
      }

      function getVirtualHeight(entry) {
        const key = getVirtualKey(entry)
        if (!state.virtualHeights.has(key)) {
          state.virtualHeights.set(key, estimateEntryHeight(entry))
        }
        return state.virtualHeights.get(key)
      }

      function getVirtualMetrics(items) {
        const cached = state.virtualMetricsCache.get(items)
        if (cached) return cached
        const offsets = [0]
        for (const entry of items) {
          offsets.push(offsets[offsets.length - 1] + getVirtualHeight(entry))
        }
        const metrics = { offsets, total: offsets[offsets.length - 1] }
        state.virtualMetricsCache.set(items, metrics)
        return metrics
      }

      function findVirtualIndex(offsets, position) {
        let low = 0
        let high = offsets.length - 1
        while (low < high) {
          const middle = Math.floor((low + high) / 2)
          if (offsets[middle] < position) low = middle + 1
          else high = middle
        }
        return Math.max(0, low - 1)
      }

      function createVirtualSpacer(height) {
        const spacer = document.createElement('div')
        spacer.className = 'virtual-spacer'
        spacer.style.height = `${Math.max(0, height)}px`
        return spacer
      }

      function scheduleVirtualRender() {
        if (!state.virtualScrolling) return
        if (state.virtualRenderScheduled) return
        state.virtualRenderScheduled = true
        const entries = state.virtualEntries
        requestAnimationFrame(() => {
          state.virtualRenderScheduled = false
          if (!state.virtualScrolling) return
          if (entries !== state.virtualEntries) return
          renderVirtualWindow()
        })
      }

      function renderFullWindow() {
        const nodes = state.virtualEntries.map(createLogEntry)
        entryList.replaceChildren(...nodes)
        state.virtualTotalHeight = 0
      }

      function findRenderedEntry(entryId) {
        if (!entryId) return null
        for (const node of entryList.querySelectorAll('[data-entry-id]')) {
          if (node.dataset.entryId === entryId) return node
        }
        return null
      }

      function renderVirtualWindow(forceBottom = false, extraEnd = 0) {
        if (!state.virtualScrolling) return
        const items = state.virtualEntries
        if (!items.length) {
          state.virtualTotalHeight = 0
          entryList.replaceChildren()
          return
        }

        const metrics = getVirtualMetrics(items)
        const viewportHeight = logList.clientHeight || 600
        const scrollTop = logList.scrollTop
        const keepBottom = forceBottom
        const anchorIndex = findVirtualIndex(metrics.offsets, scrollTop)
        const anchorId = items[anchorIndex] && items[anchorIndex].id
        const anchorOffset = scrollTop - metrics.offsets[anchorIndex]
        const anchorNode = findRenderedEntry(anchorId)
        const containerTop = logList.getBoundingClientRect().top
        const anchorTop = anchorNode
          ? anchorNode.getBoundingClientRect().top - containerTop
          : null
        const overscan = 1200
        const start = Math.max(
          0,
          findVirtualIndex(metrics.offsets, Math.max(0, scrollTop - overscan)) - 1
        )
        const baseEnd = Math.min(
          items.length,
          findVirtualIndex(
            metrics.offsets,
            scrollTop + viewportHeight + overscan
          ) + 2
        )
        const end = Math.min(items.length, baseEnd + extraEnd)
        const topSpacer = createVirtualSpacer(metrics.offsets[start])
        const bottomSpacer = createVirtualSpacer(
          metrics.total - metrics.offsets[end]
        )
        const nodes = [topSpacer]
        let lastRenderedNode = null
        for (let index = start; index < end; index += 1) {
          const article = createLogEntry(items[index])
          article.dataset.virtualIndex = String(index)
          article.dataset.entryId = items[index].id
          nodes.push(article)
          lastRenderedNode = article
        }
        nodes.push(bottomSpacer)
        entryList.replaceChildren(...nodes)
        state.virtualTotalHeight = metrics.total

        let heightChanged = false
        entryList.querySelectorAll('[data-virtual-index]').forEach(node => {
          const index = Number(node.dataset.virtualIndex)
          const entry = items[index]
          const key = getVirtualKey(entry)
          const gap = state.compactMode ? 1 : 7
          const height = node.getBoundingClientRect().height + gap
          if (Math.abs((state.virtualHeights.get(key) || 0) - height) > 1) {
            state.virtualHeights.set(key, height)
            heightChanged = true
          }
        })
        let adjustedMetrics = metrics
        if (heightChanged) {
          state.virtualMetricsCache.clear()
          adjustedMetrics = getVirtualMetrics(items)
          topSpacer.style.height = `${adjustedMetrics.offsets[start]}px`
          bottomSpacer.style.height = `${Math.max(
            0,
            adjustedMetrics.total - adjustedMetrics.offsets[end]
          )}px`
          state.virtualTotalHeight = adjustedMetrics.total
        }
        const viewportBottom = logList.getBoundingClientRect().bottom
        if (
          lastRenderedNode &&
          lastRenderedNode.getBoundingClientRect().bottom < viewportBottom - 1 &&
          end < items.length
        ) {
          return renderVirtualWindow(forceBottom, extraEnd + 16)
        }
        if (keepBottom) {
          scrollLogToBottom()
        } else if (anchorTop !== null) {
          const nextAnchorNode = findRenderedEntry(anchorId)
          if (nextAnchorNode) {
            const nextAnchorTop = nextAnchorNode.getBoundingClientRect().top -
              containerTop
            setLogScrollTop(logList.scrollTop + nextAnchorTop - anchorTop)
          } else {
            setLogScrollTop(adjustedMetrics.offsets[anchorIndex] + anchorOffset)
          }
        } else {
          setLogScrollTop(adjustedMetrics.offsets[anchorIndex] + anchorOffset)
        }
      }

      function updateFilterControls() {
        const counts = { log: 0, warn: 0, error: 0 }
        const entries = getDisplayEntries()
        for (const entry of entries) counts[entry.level] = (counts[entry.level] || 0) + 1
        for (const button of levelFilters) {
          const level = button.dataset.levelFilter
          const count = level === 'all' ? entries.length : counts[level] || 0
          button.querySelector('span').textContent = count
          button.disabled = count === 0
          button.classList.toggle('active', level === 'all'
            ? state.selectedLevels.size === 0
            : state.selectedLevels.has(level))
        }
      }

      function renderLog(scrollToBottom) {
        state.renderVersion += 1
        state.renderScrollToBottom = undefined
        updateFilterControls()
        const visible = getRenderableEntries()
        state.virtualEntries = visible
        const shouldScroll = scrollToBottom === undefined
          ? state.autoScroll && state.activeView === 'log' && isLogNearBottom()
          : scrollToBottom
        if (state.virtualScrolling) renderVirtualWindow(shouldScroll)
        else renderFullWindow()
        emptyNode.hidden = visible.length > 0
        emptyNode.textContent = state.entries.length === 0
          ? '等待 RN 日志……'
          : '没有符合当前 filter 的内容'
        $('#clear').disabled = state.entries.length === 0
        $('#export').disabled = visible.length === 0
        if (shouldScroll && !state.virtualScrolling) {
          scrollLogToBottom()
        }
      }

      function findQueuedEntry(entryId) {
        if (!entryId) return null
        return state.entryQueue.find(entry => entry.id === entryId) || null
      }

      function getEntrySignature(entry) {
        return [entry.source, entry.level, entry.message].join('\u0000')
      }

      function commitQueuedEntries() {
        if (state.refreshPaused || state.entryQueue.length === 0) return false
        const batch = state.entryQueue.splice(0, 2)
        for (const queuedEntry of batch) {
          const pendingUpdate = state.pendingUpdates.get(queuedEntry.id)
          state.entrySignatures.delete(getEntrySignature(queuedEntry))
          if (pendingUpdate) {
            queuedEntry.message = pendingUpdate.message
            cacheEntrySearchText(queuedEntry)
            state.pendingUpdates.delete(queuedEntry.id)
          }
          state.entries.push(queuedEntry)
          state.entrySignatures.add(getEntrySignature(queuedEntry))
          if (state.entries.length > 2000) {
            const removed = state.entries.shift()
            if (removed.id) {
              state.entryIds.delete(removed.id)
              state.deferredEntryIds.delete(removed.id)
              state.pendingUpdates.delete(removed.id)
            }
            state.entrySignatures.delete(getEntrySignature(removed))
          }
        }
        state.displayEntriesCache.clear()
        state.visibleEntriesCache.clear()
        state.virtualMetricsCache.clear()
        return true
      }

      function addEntry(entry) {
        const signature = getEntrySignature(entry)
        if (
          (entry.id && state.entryIds.has(entry.id)) ||
          state.entrySignatures.has(signature)
        ) return
        if (entry.id) state.entryIds.add(entry.id)
        state.entrySignatures.add(signature)
        state.entryQueue.push(entry)
        cacheEntrySearchText(entry)
        scheduleRender()
      }

      function updateEntry(update) {
        if (state.refreshPaused) {
          state.pendingUpdates.set(update.id, update)
          return
        }
        if (findQueuedEntry(update.id)) {
          state.pendingUpdates.set(update.id, update)
          scheduleRender()
          return
        }
        applyEntryUpdate(update)
      }

      function applyEntryUpdate(update) {
        const entry = state.entries.find(item => item.id === update.id)
        if (!entry) return
        state.entrySignatures.delete(
          [entry.source, entry.level, entry.message].join('\u0000')
        )
        entry.message = update.message
        cacheEntrySearchText(entry)
        state.displayEntriesCache.clear()
        state.visibleEntriesCache.clear()
        state.virtualHeights.clear()
        state.virtualMetricsCache.clear()
        state.entrySignatures.add(
          [entry.source, entry.level, entry.message].join('\u0000')
        )
        if (state.drawerEntry && state.drawerEntry.id === update.id) {
          renderDrawerMessage()
        }
        scheduleRender()
      }

      function scheduleRender() {
        if (state.refreshPaused || state.awaitingResumeChoice) return
        if (state.renderScrollToBottom === undefined) {
          state.renderScrollToBottom = state.autoScroll &&
            state.activeView === 'log' && isLogNearBottom()
        }
        if (state.renderScheduled) return
        state.renderScheduled = true
        const renderVersion = state.renderVersion
        requestAnimationFrame(() => {
          state.renderScheduled = false
          if (renderVersion !== state.renderVersion) {
            state.renderScrollToBottom = undefined
            if (state.entryQueue.length > 0) scheduleRender()
            return
          }
          if (state.refreshPaused) {
            state.renderScrollToBottom = undefined
            return
          }
          const scrollToBottom = state.renderScrollToBottom
          state.renderScrollToBottom = undefined
          commitQueuedEntries()
          if (state.activeView === 'log') renderLog(scrollToBottom)
          if (state.activeView === 'dashboard') renderDashboard()
          if (state.entryQueue.length > 0) scheduleRender()
        })
      }

      function resumeRefresh() {
        const shouldScrollToBottom = state.activeView === 'log' &&
          state.autoScroll && isLogNearBottom()
        const pauseQueueStart = state.pauseQueueStart ?? state.entryQueue.length
        const resumeBufferEnd = state.entryQueue.length
        const hasPausedContent = resumeBufferEnd > pauseQueueStart ||
          state.pendingUpdates.size > 0
        state.refreshPaused = false
        if (!state.loadHistory) {
          discardQueuedEntries(pauseQueueStart, resumeBufferEnd)
          state.pendingUpdates.clear()
          state.pauseQueueStart = null
        } else if (!hasPausedContent) {
          state.pauseQueueStart = null
        } else {
          state.awaitingResumeChoice = true
          state.resumeBufferEnd = resumeBufferEnd
          state.resumePendingUpdateIds = new Set(state.pendingUpdates.keys())
          state.renderScrollToBottom = shouldScrollToBottom
          showHistoryPrompt('resume')
          return
        }
        state.deferredEntryIds.clear()
        state.displayEntriesCache.clear()
        state.virtualHeights.clear()
        state.virtualMetricsCache.clear()
        state.renderScrollToBottom = shouldScrollToBottom
        scheduleRender()
      }

      function updateReplayProgress(current, total) {
        state.replayCurrent = current
        state.replayTotal = total
        const percentage = total ? Math.min(100, current / total * 100) : 100
        $('#progressBar').style.width = `${percentage}%`
        $('#progressText').textContent = `${current}/${total}`
      }

      function startReplay(total) {
        state.replaying = true
        updateReplayProgress(0, total)
        $('#connection').textContent = '连接中'
        $('#connection').classList.remove('online')
        $('#connectionProgress').hidden = false
      }

      function finishReplay(total) {
        updateReplayProgress(total, total)
        state.replaying = false
        $('#connectionProgress').hidden = true
        $('#connection').textContent = '已连接'
        $('#connection').classList.add('online')
      }

      function renderConsole() {
        const recent = state.entries.slice(-80)
        $('#consoleCount').textContent = `${state.entries.length} 条`
        $('#consoleOutput').replaceChildren(...recent.map(entry => {
          const line = document.createElement('div')
          line.className = 'console-line'
          const time = document.createElement('span')
          time.className = 'console-time'
          time.textContent = formatTime(entry.time)
          const level = document.createElement('span')
          level.className = `console-level ${entry.level}`
          level.textContent = entry.level
          const source = document.createElement('span')
          source.className = 'console-source'
          source.textContent = entry.source
          const message = document.createElement('span')
          message.className = 'console-message'
          renderAnsiText(message, entry.message)
          line.append(time, level, source, message)
          return line
        }))
        if (state.activeView === 'dashboard') {
          const consoleNode = $('#consoleOutput')
          consoleNode.scrollTop = consoleNode.scrollHeight
        }
      }

      function addTableRow(values) {
        const row = document.createElement('tr')
        for (const value of values) {
          const cell = document.createElement('td')
          cell.textContent = value
          row.append(cell)
        }
        return row
      }

      function renderDashboardTable() {
        const head = $('#tableHead')
        const body = $('#tableBody')
        body.replaceChildren()
        if (state.tableMode === 'levels') {
          head.innerHTML = '<tr><th>级别</th><th>数量</th><th>占比</th></tr>'
          const counts = { log: 0, warn: 0, error: 0 }
          for (const entry of state.entries) counts[entry.level] = (counts[entry.level] || 0) + 1
          for (const level of ['log', 'warn', 'error']) {
            const ratio = state.entries.length ? `${Math.round(counts[level] / state.entries.length * 100)}%` : '0%'
            body.append(addTableRow([level, counts[level], ratio]))
          }
          return
        }
        if (state.tableMode === 'sources') {
          head.innerHTML = '<tr><th>来源</th><th>数量</th><th>最新时间</th></tr>'
          const sources = new Map()
          for (const entry of state.entries) {
            const current = sources.get(entry.source) || { count: 0, time: entry.time }
            sources.set(entry.source, { count: current.count + 1, time: entry.time })
          }
          for (const [source, item] of sources) {
            body.append(addTableRow([source, item.count, formatTime(item.time)]))
          }
        } else {
          head.innerHTML = '<tr><th>时间</th><th>级别</th><th>来源</th><th>内容</th></tr>'
          for (const entry of state.entries.slice(-20).reverse()) {
            body.append(addTableRow([
              formatTime(entry.time),
              entry.level,
              entry.source,
              entry.message,
            ]))
          }
        }
        if (!body.children.length) {
          const row = document.createElement('tr')
          const cell = document.createElement('td')
          cell.colSpan = 4
          cell.className = 'muted'
          cell.textContent = '暂无数据'
          row.append(cell)
          body.append(row)
        }
      }

      function renderDashboard() {
        renderConsole()
        renderDashboardTable()
      }

      function updateControlButtons() {
        $('#startRn').disabled = state.controlBusy || state.devRunning
        $('#stopRn').disabled = state.controlBusy || !state.devRunning
        $('#controlState').textContent = state.devRunning ? '运行中' : '未运行'
        $('#controlState').className = state.devRunning ? 'status-value running' : 'status-value stopped'
        $('#statusRn').textContent = state.devRunning ? '运行中' : '未运行'
        $('#statusRn').className = state.devRunning ? 'status-value running' : 'status-value stopped'
      }

      async function refreshStatus() {
        try {
          const response = await fetch('/api/status')
          const status = await response.json()
          state.devRunning = Boolean(status.devRunning)
          $('#devCwd').textContent = status.devCwd || '未配置'
          $('#statusEntries').textContent = status.entries
          $('#statusClients').textContent = status.clients
          updateControlButtons()
        } catch {
          $('#connection').textContent = '服务不可用'
          $('#connection').classList.remove('online')
        }
      }

      async function controlRn(action) {
        if (state.controlBusy) return
        state.controlBusy = true
        updateControlButtons()
        try {
          const response = await fetch(`/api/dev/${action}`, { method: 'POST' })
          if (!response.ok) throw new Error(await response.text())
        } catch (error) {
          addEntry({
            id: `control-${Date.now()}`,
            time: new Date().toISOString(),
            level: 'error',
            source: 'dashboard',
            message: `RN 控制失败: ${error.message}`,
          })
        } finally {
          state.controlBusy = false
          await refreshStatus()
          updateControlButtons()
        }
      }

      function openDrawer(entry) {
        state.drawerEntry = entry
        state.drawerFormatted = true
        $('#drawerLevel').textContent = entry.level
        $('#drawerLevel').className = `entry-level ${entry.level}`
        $('#drawerSource').textContent = entry.source
        $('#drawerTime').textContent = formatDate(entry.time)
        $('#drawerId').textContent = entry.id
        renderDrawerMessage()
        $('#drawerBackdrop').hidden = false
        $('#drawer').hidden = false
      }

      function closeDrawer() {
        $('#drawerBackdrop').hidden = true
        $('#drawer').hidden = true
        state.drawerEntry = null
        state.drawerFormatted = false
      }

      function decodeEscapedText(value) {
        return value
          .replace(/\\r\\n/g, '\n')
          .replace(/\\n/g, '\n')
          .replace(/\\t/g, '\t')
      }

      function formatDrawerText(value) {
        const normalized = normalizeAnsi(String(value))
        try {
          const parsed = JSON.parse(normalized)
          return decodeEscapedText(JSON.stringify(parsed, null, 2))
        } catch {
          return decodeEscapedText(normalized)
        }
      }

      function getDrawerText() {
        if (!state.drawerEntry) return ''
        return state.drawerFormatted
          ? formatDrawerText(state.drawerEntry.message)
          : state.drawerEntry.message
      }

      function getDrawerBaseDirectory() {
        if (!state.drawerEntry) return ''
        try {
          const parsed = JSON.parse(normalizeAnsi(state.drawerEntry.message))
          const origin = parsed.originModulePath
          if (typeof origin !== 'string') return ''
          return origin.slice(0, origin.lastIndexOf('/'))
        } catch {
          return ''
        }
      }

      function renderDrawerMessage() {
        const messageNode = $('#drawerMessage')
        messageNode.replaceChildren()
        renderAnsiText(messageNode, getDrawerText(), getKeyword(), {
          linkify: true,
          baseDirectory: getDrawerBaseDirectory(),
        })
        $('#formatLog').textContent = state.drawerFormatted ? '显示原文' : '格式化'
      }

      function toggleDrawerFormat() {
        if (!state.drawerEntry) return
        state.drawerFormatted = !state.drawerFormatted
        renderDrawerMessage()
      }

      function setActiveView(viewName, forceLogBottom = false) {
        const wasLogView = state.activeView === 'log'
        state.activeView = viewName
        document.querySelectorAll('[data-view]').forEach(node => {
          node.classList.toggle('active', node.dataset.view === viewName)
        })
        $('#dashboardView').classList.toggle('active', viewName === 'dashboard')
        $('#logView').classList.toggle('active', viewName === 'log')
        if (viewName === 'log') {
          renderLog(forceLogBottom || !wasLogView)
        }
        if (viewName === 'dashboard') renderDashboard()
      }

      function setCompactMode(enabled) {
        state.compactMode = enabled
        $('#compactModeSetting').checked = enabled
        state.virtualHeights.clear()
        state.virtualMetricsCache.clear()
        renderLog()
      }

      function setMergeStartup(enabled) {
        state.mergeStartup = enabled
        $('#mergeStartupSetting').checked = enabled
        state.displayEntriesCache.clear()
        state.visibleEntriesCache.clear()
        state.virtualHeights.clear()
        state.virtualMetricsCache.clear()
        renderLog()
      }

      function setVirtualScrolling(enabled) {
        state.virtualScrolling = enabled
        $('#virtualScrollingSetting').checked = enabled
        state.virtualHeights.clear()
        state.virtualMetricsCache.clear()
        state.virtualRenderScheduled = false
        renderLog()
      }

      function openSettings() {
        $('#settingsBackdrop').hidden = false
        $('#settingsModal').hidden = false
      }

      function closeSettings() {
        $('#settingsBackdrop').hidden = true
        $('#settingsModal').hidden = true
      }

      function setHistoryPromptVisible(visible) {
        $('#historyPrompt').hidden = !visible
      }

      function showHistoryPrompt(mode = 'initial') {
        if (!state.loadHistory || (mode === 'initial' && state.historyLoading)) return
        if (mode === 'initial') {
          if (state.historyPromptShown || state.historyLoaded) return
          state.historyPromptShown = true
          $('#historyPromptTitle').textContent = '加载历史消息？'
          $('#historyPromptMessage').textContent = '服务中已有的日志将加入当前列表'
        } else {
          $('#historyPromptTitle').textContent = '加载暂停期间的记录？'
          $('#historyPromptMessage').textContent = '暂停记录期间收到的日志将加入当前列表'
        }
        state.historyPromptMode = mode
        setHistoryPromptVisible(true)
      }

      function skipHistory() {
        if (state.historyPromptMode === 'resume') {
          resolveResumeHistory(false)
          return
        }
        state.historyPromptShown = true
        state.historyPromptMode = null
        setHistoryPromptVisible(false)
      }

      async function loadHistory() {
        if (state.historyPromptMode === 'resume') {
          resolveResumeHistory(true)
          return
        }
        if (state.historyLoading || state.historyLoaded) return
        state.historyLoading = true
        state.historyPromptShown = true
        state.historyPromptMode = null
        setHistoryPromptVisible(false)
        try {
          const response = await fetch('/api/history')
          if (!response.ok) throw new Error('history request failed')
          const entries = await response.json()
          startReplay(entries.length)
          for (let index = 0; index < entries.length; index += 1) {
            addEntry(entries[index])
            updateReplayProgress(index + 1, entries.length)
          }
          state.historyLoaded = true
          finishReplay(entries.length)
        } catch {
          state.historyPromptShown = false
          setHistoryPromptVisible(true)
        } finally {
          state.historyLoading = false
        }
      }

      function rebuildEntryIndexes() {
        state.entryIds.clear()
        state.entrySignatures.clear()
        for (const entry of [...state.entries, ...state.entryQueue]) {
          if (entry.id) state.entryIds.add(entry.id)
          state.entrySignatures.add(getEntrySignature(entry))
        }
      }

      function discardQueuedEntries(start, end) {
        const count = Math.max(0, end - start)
        if (!count) return
        state.entryQueue.splice(start, count)
        rebuildEntryIndexes()
        state.displayEntriesCache.clear()
        state.visibleEntriesCache.clear()
        state.virtualMetricsCache.clear()
      }

      function resolveResumeHistory(shouldLoad) {
        if (!state.awaitingResumeChoice) return
        if (!shouldLoad) {
          discardQueuedEntries(state.pauseQueueStart ?? 0, state.resumeBufferEnd ?? 0)
          for (const id of state.resumePendingUpdateIds) {
            state.pendingUpdates.delete(id)
          }
        } else {
          for (const update of state.pendingUpdates.values()) {
            if (!findQueuedEntry(update.id)) applyEntryUpdate(update)
          }
        }
        state.awaitingResumeChoice = false
        state.pauseQueueStart = null
        state.resumeBufferEnd = null
        state.resumePendingUpdateIds.clear()
        state.historyPromptMode = null
        setHistoryPromptVisible(false)
        state.deferredEntryIds.clear()
        state.displayEntriesCache.clear()
        state.virtualHeights.clear()
        state.virtualMetricsCache.clear()
        scheduleRender()
      }

      async function copyDrawerLog() {
        if (!state.drawerEntry) return
        const copyButton = $('#copyLog')
        await copyText(getDrawerText())
        copyButton.textContent = '已复制'
        setTimeout(() => { copyButton.textContent = '复制日志' }, 1200)
      }

      document.querySelectorAll('[data-view]').forEach(button => {
        button.addEventListener('click', () => {
          setActiveView(button.dataset.view)
        })
      })
      $('#sidebarToggle').addEventListener('click', () => {
        $('#sidebar').classList.toggle('collapsed')
      })
      $('#tableMode').addEventListener('change', event => {
        state.tableMode = event.target.value
        renderDashboardTable()
      })
      $('#startRn').addEventListener('click', () => controlRn('start'))
      $('#stopRn').addEventListener('click', () => controlRn('stop'))
      $('#settingsButton').addEventListener('click', openSettings)
      $('#settingsClose').addEventListener('click', closeSettings)
      $('#settingsBackdrop').addEventListener('click', closeSettings)
      $('#compactModeSetting').addEventListener('change', event => {
        setCompactMode(event.currentTarget.checked)
      })
      $('#mergeStartupSetting').addEventListener('change', event => {
        setMergeStartup(event.currentTarget.checked)
      })
      $('#virtualScrollingSetting').addEventListener('change', event => {
        setVirtualScrolling(event.currentTarget.checked)
      })
      $('#loadHistorySetting').checked = state.loadHistory
      $('#loadHistorySetting').addEventListener('change', event => {
        state.loadHistory = event.currentTarget.checked
        writeStoredBoolean('loadHistory', state.loadHistory)
        if (!state.loadHistory && state.awaitingResumeChoice) {
          resolveResumeHistory(false)
        }
        if (state.loadHistory && state.connected) showHistoryPrompt()
        if (!state.loadHistory) setHistoryPromptVisible(false)
      })
      $('#loadHistory').addEventListener('click', loadHistory)
      $('#skipHistory').addEventListener('click', skipHistory)
      searchNode.addEventListener('input', () => {
        state.virtualMetricsCache.clear()
        renderLog()
        if (state.drawerEntry) renderDrawerMessage()
      })
      levelFilters.forEach(button => {
        button.addEventListener('click', () => {
          const level = button.dataset.levelFilter
          const count = Number(button.querySelector('span').textContent)
          if (count === 0) return
          if (level === 'all') state.selectedLevels.clear()
          else if (state.selectedLevels.has(level)) state.selectedLevels.delete(level)
          else state.selectedLevels.add(level)
          setActiveView('log', true)
        })
      })
      $('#pause').addEventListener('click', event => {
        if (state.awaitingResumeChoice) return
        if (state.refreshPaused) {
          resumeRefresh()
          event.currentTarget.textContent = '暂停记录'
          event.currentTarget.classList.remove('active')
          return
        }
        state.pauseQueueStart = state.entryQueue.length
        state.refreshPaused = true
        event.currentTarget.textContent = '恢复记录'
        event.currentTarget.classList.add('active')
      })
      $('#clear').addEventListener('click', () => {
        state.entries.length = 0
        state.entryIds.clear()
        state.entrySignatures.clear()
        state.displayEntriesCache.clear()
        state.visibleEntriesCache.clear()
        state.searchTextCache = new WeakMap()
        state.virtualEntries = []
        state.entryQueue.length = 0
        state.virtualHeights.clear()
        state.virtualMetricsCache.clear()
        state.deferredEntryIds.clear()
        state.pendingUpdates.clear()
        state.pauseQueueStart = null
        state.resumeBufferEnd = null
        state.resumePendingUpdateIds.clear()
        state.awaitingResumeChoice = false
        state.historyPromptMode = null
        setHistoryPromptVisible(false)
        if (state.activeView === 'log') renderLog()
        if (state.activeView === 'dashboard') renderDashboard()
      })
      $('#export').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(getVisibleEntries(), null, 2)], { type: 'application/json' })
        const url = URL.createObjectURL(blob)
        const link = document.createElement('a')
        link.href = url
        link.download = `rn-logs-${new Date().toISOString().replace(/[:.]/g, '-')}.json`
        link.click()
        URL.revokeObjectURL(url)
      })
      $('#drawerClose').addEventListener('click', closeDrawer)
      $('#drawerBackdrop').addEventListener('click', closeDrawer)
      $('#formatLog').addEventListener('click', toggleDrawerFormat)
      $('#copyLog').addEventListener('click', copyDrawerLog)
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return
        closeDrawer()
        closeSettings()
      })
      logList.addEventListener('scroll', () => {
        if (state.virtualScrolling && !state.programmaticScroll) {
          scheduleVirtualRender()
        }
      }, { passive: true })
      window.addEventListener('resize', () => {
        state.virtualHeights.clear()
        state.virtualMetricsCache.clear()
        if (state.virtualScrolling) scheduleVirtualRender()
      })

      fetch('/api/status').then(response => response.json()).then(status => {
        $('#devCwd').textContent = status.devCwd || '未配置'
        refreshStatus()
      }).catch(() => {})
      setInterval(refreshStatus, 1200)

      const eventSource = new EventSource('/events?history=0')
      eventSource.onopen = () => {
        state.connected = true
        if (!state.replaying) {
          $('#connection').textContent = '已连接'
          $('#connection').classList.add('online')
        }
        showHistoryPrompt()
      }
      eventSource.onmessage = event => addEntry(JSON.parse(event.data))
      eventSource.addEventListener('update', event => {
        updateEntry(JSON.parse(event.data))
      })
      eventSource.addEventListener('replay-start', event => {
        startReplay(JSON.parse(event.data).total)
      })
      eventSource.addEventListener('replay-progress', event => {
        const progress = JSON.parse(event.data)
        updateReplayProgress(progress.current, progress.total)
      })
      eventSource.addEventListener('replay-end', event => {
        finishReplay(JSON.parse(event.data).total)
      })
      eventSource.addEventListener('reload', () => window.location.reload())
      eventSource.onerror = () => {
        state.connected = false
        $('#connection').textContent = '连接断开，重试中'
        $('#connection').classList.remove('online')
      }

      renderLog()
      renderDashboard()
    </script>
  </body>
</html>
